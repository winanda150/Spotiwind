<!-- Konten ini akan disuntikkan ke dalam .app-container di mobile.html -->

<body>
    <header class="mobile-header">
        <div class="header-left">
            <img src="frontend/public/Elemen/Logo/Spotiwind.webp" alt="Spotiwind Logo" class="mobile-logo">
            <span class="mobile-brand-name">Spotiwind</span>
        </div>
        <div class="header-right">
            <button id="notificationBtn" class="notification-btn" aria-label="Notifications">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>
                <span id="notificationBadge" class="notification-badge hidden"></span>
            </button>
            <div class="avatar-container">
                <img id="userAvatar" class="mobile-avatar" src="" alt="User Avatar">
                <span class="online-status"></span>
            </div>
            <!-- Profile Dropdown Menu -->
            <div id="profileDropdown" class="profile-dropdown-menu">
                <div class="dropdown-user-info">
                    <img id="dropdownUserAvatar" src="" alt="User Avatar">
                    <div class="user-details">
                        <span id="dropdownUserName">User Name</span>
                        <span id="dropdownUserEmail">user@example.com</span>
                    </div>
                </div>
                <div class="dropdown-separator"></div>
                <a href="#" class="dropdown-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                        <circle cx="12" cy="7" r="4" />
                    </svg>
                    <span>My Profile</span>
                </a>
                <a href="#" class="dropdown-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path
                            d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z">
                        </path>
                    </svg>
                    <span>Liked Songs</span>
                </a>
                <a href="#" class="dropdown-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <line x1="8" y1="6" x2="21" y2="6"></line>
                        <line x1="8" y1="12" x2="21" y2="12"></line>
                        <line x1="8" y1="18" x2="21" y2="18"></line>
                        <line x1="3" y1="6" x2="3.01" y2="6"></line>
                        <line x1="3" y1="12" x2="3.01" y2="12"></line>
                        <line x1="3" y1="18" x2="3.01" y2="18"></line>
                    </svg>
                    <span>My Playlists</span>
                </a>
                <div class="dropdown-separator"></div>
                <a href="#" class="dropdown-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path
                            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
                        </path>
                    </svg>
                    <span>Settings</span>
                </a>
                <a href="#" class="dropdown-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                        <line x1="12" y1="17" x2="12.01" y2="17"></line>
                    </svg>
                    <span>Help & Support</span>
                </a>
                <div class="dropdown-separator"></div>
                <button id="logoutBtn" class="dropdown-item dropdown-item-logout">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    <span>Logout</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Search Bar -->
    <section class="search-section">
        <div class="search-box">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="searchInput" placeholder="What do you want to listen to?">
            <button id="clearSearch" class="clear-search-btn" title="Clear search">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
            <!-- Dropdown untuk hasil pencarian cepat -->
            <div id="searchDropdown" class="search-results-dropdown"></div>
        </div>
    </section>

    <!-- Konten utama halaman pencarian -->
    <main class="mobile-content">
        <!-- Bagian ini akan menampilkan hasil pencarian atau kategori -->
        <div id="searchPageContent">
            <section class="browse-all-section">
                <div class="section-header" style="margin-bottom: 1rem;">
                    <h2 class="section-title">Browse all</h2>
                </div>
                <div class="browse-grid" style="padding: 0 1.5rem 1.5rem 1.5rem;">
                    <div class="browse-card" style="background-color: #E13300;">
                        <span>Music</span>
                        <img src="frontend/public/Elemen/Logo/Gambar1.webp" alt="Music">
                    </div>
                    <div class="browse-card" style="background-color: #1E3264;">
                        <span>Podcasts</span>
                        <img src="frontend/public/Elemen/Logo/Gambar2.webp" alt="Podcasts">
                    </div>
                    <div class="browse-card" style="background-color: #8D67AB;">
                        <span>Live Events</span>
                    </div>
                    <div class="browse-card" style="background-color: #B49BC8;">
                        <span>Made For You</span>
                    </div>
                    <div class="browse-card" style="background-color: #BA5D07;">
                        <span>New Releases</span>
                    </div>
                    <div class="browse-card" style="background-color: #E8115B;">
                        <span>Pop</span>
                    </div>
                    <div class="browse-card" style="background-color: #AF2896;">
                        <span>Indie</span>
                    </div>
                    <div class="browse-card" style="background-color: #509BF5;">
                        <span>Charts</span>
                    </div>
                </div>
            </section>
        </div>
    </main>
</body>
