<!-- Konten ini akan disuntikkan ke dalam .app-container di mobile.html -->

<body>
    <header class="mobile-header">
        <div class="header-left">
            <img src="frontend/public/Elemen/Logo/Spotiwind.webp" alt="Spotiwind Logo" class="mobile-logo">
            <span class="mobile-brand-name">Spotiwind</span>
        </div>
        <div class="header-right">
            <button id="notificationBtn" class="notification-btn" aria-label="Notifications">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>
                <span id="notificationBadge" class="notification-badge hidden"></span>
            </button>
            <div class="avatar-container">
                <img id="userAvatar" class="mobile-avatar" src="" alt="User Avatar">
                <span class="online-status"></span>
            </div>
            <!-- Profile Dropdown Menu -->
            <div id="profileDropdown" class="profile-dropdown-menu">
                <div class="dropdown-user-info">
                    <img id="dropdownUserAvatar" src="" alt="User Avatar">
                    <div class="user-details">
                        <span id="dropdownUserName">User Name</span>
                        <span id="dropdownUserEmail">user@example.com</span>
                    </div>
                </div>
                <div class="dropdown-separator"></div>
                <a href="#" class="dropdown-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                        <circle cx="12" cy="7" r="4" />
                    </svg>
                    <span>My Profile</span>
                </a>
                <a href="#" class="dropdown-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path
                            d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z">
                        </path>
                    </svg>
                    <span>Liked Songs</span>
                </a>
                <a href="#" class="dropdown-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <line x1="8" y1="6" x2="21" y2="6"></line>
                        <line x1="8" y1="12" x2="21" y2="12"></line>
                        <line x1="8" y1="18" x2="21" y2="18"></line>
                        <line x1="3" y1="6" x2="3.01" y2="6"></line>
                        <line x1="3" y1="12" x2="3.01" y2="12"></line>
                        <line x1="3" y1="18" x2="3.01" y2="18"></line>
                    </svg>
                    <span>My Playlists</span>
                </a>
                <div class="dropdown-separator"></div>
                <button id="logoutBtn" class="dropdown-item dropdown-item-logout">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    <span>Logout</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Konten utama halaman akun -->
    <main class="mobile-content" style="padding: 1.5rem;">
        <div class="account-profile-card">
            <div class="account-avatar-wrapper">
                <img id="accountAvatar" src="https://ui-avatars.com/api/?name=User+Name&background=B91EC9&color=fff&bold=true&size=128" alt="User Avatar" class="account-avatar">
                <button class="edit-avatar-btn" aria-label="Edit Avatar">
                    <svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16">
                        <path d="M17.414 2.586a2 2 0 00-2.828 0L7 10.172V13h2.828l7.586-7.586a2 2 0 000-2.828z" />
                        <path fill-rule="evenodd" d="M2 6a2 2 0 012-2h4a1 1 0 010 2H4v10h10v-4a1 1 0 112 0v4a2 2 0 01-2 2H4a2 2 0 01-2-2V6z" clip-rule="evenodd" />
                    </svg>
                </button>
            </div>
            <div class="account-info">
                <h1 id="accountName" class="account-name">User Name</h1>
                <p id="accountEmail" class="account-email">user@example.com</p>
            </div>
            <button class="edit-profile-btn">Edit Profile</button>
        </div>

        <!-- Grup Pengaturan -->
        <div class="settings-group">
            <h2 class="settings-group-title">Account</h2>
            <div class="settings-item">
                <span class="settings-item-text">Manage Subscription</span>
                <svg class="settings-item-chevron" viewBox="0 0 20 20" fill="currentColor" width="16" height="16"><path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" /></svg>
            </div>
            <div class="settings-item">
                <span class="settings-item-text">Change Password</span>
                <svg class="settings-item-chevron" viewBox="0 0 20 20" fill="currentColor" width="16" height="16"><path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" /></svg>
            </div>
        </div>

        <div class="settings-group">
            <h2 class="settings-group-title">Preferences</h2>
            <div class="settings-item">
                <span class="settings-item-text">Notifications</span>
                <label class="toggle-switch">
                    <input type="checkbox" checked>
                    <span class="slider"></span>
                </label>
            </div>
            <div class="settings-item">
                <span class="settings-item-text">Data Saver</span>
                <label class="toggle-switch">
                    <input type="checkbox">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="settings-item">
                <span class="settings-item-text">Language</span>
                <div class="settings-item-value">
                    <span>English</span>
                    <svg class="settings-item-chevron" viewBox="0 0 20 20" fill="currentColor" width="16" height="16"><path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" /></svg>
                </div>
            </div>
        </div>

        <div class="settings-group">
            <h2 class="settings-group-title">Support</h2>
            <div class="settings-item">
                <span class="settings-item-text">Help Center</span>
                <svg class="settings-item-chevron" viewBox="0 0 20 20" fill="currentColor" width="16" height="16"><path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" /></svg>
            </div>
            <div class="settings-item">
                <span class="settings-item-text">About Spotiwind</span>
                <svg class="settings-item-chevron" viewBox="0 0 20 20" fill="currentColor" width="16" height="16"><path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" /></svg>
            </div>
        </div>

        <button id="logoutBtnBottom" class="logout-btn-bottom">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            <span>Log Out</span>
        </button>

    </main>
</body>
