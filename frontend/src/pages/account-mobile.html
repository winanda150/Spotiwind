<body>
    <header class="mobile-header">
        <div class="header-left">
            <button class="menu-btn" type="button" aria-label="Open menu">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
        </div>
        <div class="header-brand">
            <img src="../../public/Elemen/Logo/Spotiwind.webp" alt="Spotiwind Logo" class="mobile-logo">
            <span class="mobile-brand-name">Spotiwind</span>
        </div>
        <div class="header-right">
            <button id="notificationBtn" class="notification-btn" type="button" aria-label="Notifications">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                    <path d="M13.73 21a2 2 0 0 0-3.46 0"></path>
                </svg>
                <span id="notificationBadge" class="notification-badge hidden"></span>
            </button>
        </div>
    </header>

    <main class="mobile-content account-page">
        <!-- Profile Header Section -->
        <section class="account-profile-header">
            <div class="account-avatar-wrapper">
                <img id="accountAvatar" src="https://ui-avatars.com/api/?name=User&background=B91EC9&color=fff&bold=true&size=512" alt="User Avatar" class="account-avatar" referrerpolicy="no-referrer">
                <div class="avatar-camera-badge" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                        <circle cx="12" cy="13" r="4"></circle>
                    </svg>
                </div>
            </div>
            <div class="account-profile-info">
                <div class="account-user-meta">
                    <div class="account-name-row">
                        <h1 id="accountName" class="account-name">User Name</h1>
                        <span id="accountProBadge" class="pro-badge hidden">PRO</span>
                    </div>
                    <p id="accountEmail" class="account-email">user@example.com</p>
                    <div id="accountCodeWrapper" class="account-code-wrapper" role="button" tabindex="0" aria-label="ID Akun">
                        <span class="account-code-label">ID:</span>
                        <span id="accountCode" class="account-code-value">#SPW-000000</span>
                        <svg class="account-code-copy-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                    </div>
                </div>
                <button id="editProfileBtn" class="edit-profile-btn" type="button">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <span>Edit Profile</span>
                </button>
            </div>
        </section>
        
        <!-- Account Stats Box Section -->
        <section class="account-stats-card" aria-label="Statistik Akun">
            <div class="stat-item" role="button" tabindex="0" data-stat="playlists">
                <div class="stat-icon-wrapper stat-icon--playlists">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M21 15V6"></path>
                        <path d="M18.5 18a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"></path>
                        <path d="M12 12H3"></path>
                        <path d="M16 6H3"></path>
                        <path d="M12 18H3"></path>
                    </svg>
                </div>
                <span class="stat-label">Playlists</span>
                <span id="statPlaylists" class="stat-value">0</span>
            </div>
            <div class="stat-divider" aria-hidden="true"></div>
            <div class="stat-item" role="button" tabindex="0" data-stat="followers">
                <div class="stat-icon-wrapper stat-icon--followers">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="9" cy="7" r="4"></circle>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                    </svg>
                </div>
                <span class="stat-label">Followers</span>
                <span id="statFollowers" class="stat-value">0</span>
            </div>
            <div class="stat-divider" aria-hidden="true"></div>
            <div class="stat-item" role="button" tabindex="0" data-stat="following">
                <div class="stat-icon-wrapper stat-icon--following">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                        <circle cx="9" cy="7" r="4"></circle>
                        <line x1="19" y1="8" x2="19" y2="14"></line>
                        <line x1="22" y1="11" x2="16" y2="11"></line>
                    </svg>
                </div>
                <span class="stat-label">Following</span>
                <span id="statFollowing" class="stat-value">0</span>
            </div>
            <div class="stat-divider" aria-hidden="true"></div>
            <div class="stat-item" role="button" tabindex="0" data-stat="likes">
                <div class="stat-icon-wrapper stat-icon--likes">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                    </svg>
                </div>
                <span class="stat-label">Likes</span>
                <span id="statLikes" class="stat-value">0</span>
            </div>
        </section>

        <!-- Spotiwind PRO Banner Section -->
        <section class="spotiwind-pro-banner" aria-label="Spotiwind PRO">
            <div class="pro-banner-glow" aria-hidden="true"></div>
            <div class="pro-banner-left">
                <div class="pro-crown-emblem" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="currentColor" class="pro-crown-icon" aria-hidden="true">
                        <path d="M5 16h14a1 1 0 0 0 1-1L21 6l-4.5 4L12 3 7.5 10 3 6l1 9a1 1 0 0 0 1 1zm-1 2a1 1 0 0 0 0 2h16a1 1 0 1 0 0-2H4z"/>
                    </svg>
                </div>
                <div class="pro-banner-text">
                    <h2 class="pro-banner-title">Spotiwind PRO</h2>
                    <p class="pro-banner-desc">Enjoy ad-free music, unlimited skips, offline downloads, and more.</p>
                </div>
            </div>
            <button id="managePlanBtn" class="pro-banner-btn" type="button" aria-label="Manage plan">
                <span>Manage plan</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </button>
        </section>
    </main>

    <!-- Profile Avatar Fullscreen Square Preview -->
    <div id="avatarPreviewModal" class="avatar-preview-modal hidden" aria-hidden="true">
        <div class="avatar-preview-backdrop"></div>
        
        <!-- Header Mode Pratinjau Gelap -->
        <header class="avatar-preview-header">
            <div class="avatar-preview-header-left">
                <button id="avatarPreviewBackBtn" class="preview-header-btn" type="button" aria-label="Kembali">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                </button>
                <span class="preview-header-title">Foto profile</span>
            </div>
            <div class="avatar-preview-header-right">
                <button id="avatarPreviewEditBtn" class="preview-header-btn" type="button" aria-label="Edit foto">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path>
                    </svg>
                </button>
                <button id="avatarPreviewShareBtn" class="preview-header-btn" type="button" aria-label="Bagikan foto">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="18" cy="5" r="3"></circle>
                        <circle cx="6" cy="12" r="3"></circle>
                        <circle cx="18" cy="19" r="3"></circle>
                        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                    </svg>
                </button>
            </div>
        </header>

        <div class="avatar-preview-dialog" role="dialog" aria-modal="true" aria-label="Foto Profil">
            <div class="avatar-preview-square-wrapper">
                <img id="avatarPreviewImg" src="" alt="Foto Profil" class="avatar-preview-square-img">
            </div>
        </div>
    </div>
</body>
