<body>
    <header class="mobile-header">
    <div class="header-left">
        <button class="menu-btn" type="button" aria-label="Open menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>
    </div>
    <div class="header-brand">
        <img src="frontend/public/Elemen/Logo/Spotiwind.webp" alt="Spotiwind Logo" class="mobile-logo">
        <span class="mobile-brand-name">Spotiwind</span>
    </div>
    <div class="header-right">
        <button id="notificationBtn" class="notification-btn" type="button" aria-label="Notifications">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                <path d="M13.73 21a2 2 0 0 0-3.46 0"></path>
            </svg>
            <span id="notificationBadge" class="notification-badge hidden"></span>
        </button>
    </div>
</header>

    <main class="mobile-content library-page">
        <section class="library-hero">
            <div class="library-hero__content">
                <span class="library-hero__eyebrow">Your collection</span>
                <h1 class="section-title">Your Library</h1>
                <p class="library-hero__description">Organize your favorite playlists, discover artists, and keep every
                    album close to hand.</p>
            </div>
            <button class="add-playlist-btn" type="button" aria-label="Create playlist">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="16"></line>
                    <line x1="8" y1="12" x2="16" y2="12"></line>
                </svg>
            </button>
        </section>

        <div class="library-stats" aria-label="Library statistics">
            <div class="stat-pill">
                <span>Playlists</span>
                <strong>12</strong>
            </div>
            <div class="stat-pill">
                <span>Artists</span>
                <strong>28</strong>
            </div>
            <div class="stat-pill">
                <span>Albums</span>
                <strong>9</strong>
            </div>
        </div>

        <div class="library-filters" role="tablist" aria-label="Library filters">
            <button class="filter-btn active" type="button" data-filter="playlists">Playlists</button>
            <button class="filter-btn" type="button" data-filter="artists">Artists</button>
            <button class="filter-btn" type="button" data-filter="albums">Albums</button>
        </div>

        <div id="libraryContent" class="library-content-container" aria-live="polite"></div>
    </main>
</body>
