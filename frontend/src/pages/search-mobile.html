<!-- Konten ini akan disuntikkan ke dalam .app-container di mobile.html -->

<body>
    <header class="mobile-header">
        <div class="header-left">
            <button class="menu-btn" type="button" aria-label="Open menu">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" aria-hidden="true">
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
        </div>
        <div class="header-brand">
            <img src="frontend/public/Elemen/Logo/Spotiwind.webp" alt="Spotiwind Logo" class="mobile-logo">
            <span class="mobile-brand-name">Spotiwind</span>
        </div>
        <div class="header-right">
            <button id="notificationBtn" class="notification-btn" type="button" aria-label="Notifications">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" aria-hidden="true">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>
            </button>
        </div>
    </header>

    <!-- Search Bar -->
    <section class="search-section">
        <div class="search-heading">
            <div class="search-heading-copy">
                <h1>Search</h1>
                <p>Find your sound, ride the wind.</p>
            </div>
            <button class="microphone-btn" type="button" aria-label="Search by voice" title="Search by voice">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="9" y="2" width="6" height="12" rx="3"></rect>
                    <path d="M5 10a7 7 0 0 0 14 0"></path>
                    <line x1="12" y1="19" x2="12" y2="22"></line>
                    <line x1="8" y1="22" x2="16" y2="22"></line>
                </svg>
            </button>
        </div>
        <div class="search-box">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="search" id="searchInput" enterkeyhint="search" placeholder="Search songs, artists, albums...">
            <button id="clearSearch" class="clear-search-btn" title="Clear search">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
            <span class="search-submit-divider" aria-hidden="true"></span>
            <button id="searchSubmitBtn" class="search-submit-btn" type="button" aria-label="Search" title="Search">
                <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M5 12h14"></path>
                    <path d="m12 5 7 7-7 7"></path>
                </svg>
            </button>
            <!-- Dropdown untuk hasil pencarian cepat -->
            <div id="searchDropdown" class="search-results-dropdown"></div>
        </div>
    </section>

    <!-- Browse by mood -->
    <section class="search-mood-section" aria-labelledby="searchMoodTitle">
        <div class="search-mood-header">
            <h2 id="searchMoodTitle">Browse by mood</h2>
            <a href="#" class="search-mood-see-all">See all</a>
        </div>
        <div class="search-mood-grid">
            <div class="search-mood-card search-mood-card--chill">
                <span class="search-mood-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8h1a4 4 0 0 1 0 8h-1"></path><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path><line x1="6" y1="1" x2="6" y2="4"></line><line x1="10" y1="1" x2="10" y2="4"></line><line x1="14" y1="1" x2="14" y2="4"></line></svg></span>
                <span class="search-mood-info"><strong>Chill</strong><small>120 songs</small></span>
            </div>
            <div class="search-mood-card search-mood-card--focus">
                <span class="search-mood-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 18v-6a9 9 0 0 1 18 0v6"></path><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path></svg></span>
                <span class="search-mood-info"><strong>Focus</strong><small>85 songs</small></span>
            </div>
            <div class="search-mood-card search-mood-card--workout">
                <span class="search-mood-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8h2a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-2V8Z"></path><path d="M4 8h2v8H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z"></path><path d="M6 5h2v14H6V5Z"></path><path d="M16 5h2v14h-2V5Z"></path><path d="M2 12h20"></path></svg></span>
                <span class="search-mood-info"><strong>Workout</strong><small>150 songs</small></span>
            </div>
            <div class="search-mood-card search-mood-card--sleep">
                <span class="search-mood-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1-8.313-12.454z"></path></svg></span>
                <span class="search-mood-info"><strong>Sleep</strong><small>60 songs</small></span>
            </div>
            <div class="search-mood-card search-mood-card--happy">
                <span class="search-mood-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M8 14s1.5 2 4 2 4-2 4-2"></path><line x1="9" y1="9" x2="9.01" y2="9"></line><line x1="15" y1="9" x2="15.01" y2="9"></line></svg></span>
                <span class="search-mood-info"><strong>Happy</strong><small>200 songs</small></span>
            </div>
            <div class="search-mood-card search-mood-card--romantic">
                <span class="search-mood-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg></span>
                <span class="search-mood-info"><strong>Romantic</strong><small>95 songs</small></span>
            </div>
        </div>
    </section>

    <!-- Recent searches -->
    <section class="recent-searches-section" aria-labelledby="recentSearchesTitle">
        <div class="recent-searches-header">
            <h2 id="recentSearchesTitle">Recent searches</h2>
            <button id="clearRecentSearches" class="clear-recent-searches" type="button">Clear all</button>
        </div>
        <div id="recentSearchesList" class="recent-searches-grid"></div>
    </section>

    <!-- Popular search results -->
    <section class="popular-search-section" aria-labelledby="popularSearchTitle">
        <h2 id="popularSearchTitle">Popular searches</h2>
        <div class="popular-search-tabs" role="tablist" aria-label="Popular search categories">
            <button class="popular-search-tab is-active" type="button" role="tab" aria-selected="true" data-popular-tab="top">Top results</button>
            <button class="popular-search-tab" type="button" role="tab" aria-selected="false" data-popular-tab="songs">Songs</button>
            <button class="popular-search-tab" type="button" role="tab" aria-selected="false" data-popular-tab="artists">Artists</button>
            <button class="popular-search-tab" type="button" role="tab" aria-selected="false" data-popular-tab="albums">Albums</button>
            <span class="popular-search-active-indicator" aria-hidden="true"></span>
        </div>
        <div id="popularSearchContent" class="popular-search-content"></div>
    </section>

    <!-- Konten utama halaman pencarian -->
    <main class="mobile-content">
        <!-- Bagian ini akan menampilkan hasil pencarian atau kategori -->
        <div id="searchPageContent">
        </div>
    </main>
</body>
