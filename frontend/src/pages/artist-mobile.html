<!-- Konten ini akan disuntikkan ke dalam .app-container di home-mobile.html -->

<body>
    <div class="artist-page-header">
        <button class="back-btn" aria-label="Go back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
        </button>
        <h2 id="artistPageName" class="artist-page-title" aria-hidden="true"></h2>
        <div class="header-placeholder" style="width: 44px;"></div> <!-- Placeholder to balance the back button -->
    </div>

    <!-- Hero Section with Artist Photo -->
    <div id="artistHero" class="artist-hero-section">
        <img id="artistHeroImage" class="artist-hero-image" src="" alt="" referrerpolicy="no-referrer">
    </div>

    <!-- [FIX] Wrapper for all scrollable content, positioned over the hero -->
    <div class="artist-content-scroll-wrapper">
        <!-- [FIX] Wrapper untuk nama artis, agar bisa ikut scroll -->
        <div id="artistNameWrapper" class="artist-name-wrapper">
            <!-- Nama akan disuntikkan di sini oleh JS -->
        </div>
        <!-- This inner wrapper has the solid background that scrolls up -->
        <div class="artist-songs-content">
            <!-- Popular Songs Section -->
            <div class="section-header" style="padding: 1.5rem var(--mobile-horizontal-padding) 0 var(--mobile-horizontal-padding);">
                <h2 class="section-title">Popular Songs</h2>
            </div>
            <div id="artistSongsGrid" class="song-grid artist-songs-list">
                <!-- Skeleton loader untuk daftar lagu artis (vertikal) -->
                <div class="artist-song-list-item-skeleton skeleton">
                    <div class="skeleton-item-left"></div>
                    <div class="skeleton-item-info">
                        <div class="skeleton-item-name"></div>
                        <div class="skeleton-item-artist"></div>
                    </div>
                    <div class="skeleton-item-right"></div>
                </div>
                <div class="artist-song-list-item-skeleton skeleton">
                    <div class="skeleton-item-left"></div>
                    <div class="skeleton-item-info">
                        <div class="skeleton-item-name"></div>
                        <div class="skeleton-item-artist"></div>
                    </div>
                    <div class="skeleton-item-right"></div>
                </div>
                <div class="artist-song-list-item-skeleton skeleton">
                    <div class="skeleton-item-left"></div>
                    <div class="skeleton-item-info">
                        <div class="skeleton-item-name"></div>
                        <div class="skeleton-item-artist"></div>
                    </div>
                    <div class="skeleton-item-right"></div>
                </div>
                <div class="artist-song-list-item-skeleton skeleton">
                    <div class="skeleton-item-left"></div>
                    <div class="skeleton-item-info">
                        <div class="skeleton-item-name"></div>
                        <div class="skeleton-item-artist"></div>
                    </div>
                    <div class="skeleton-item-right"></div>
                </div>
            </div>
        </div>
    </div>
</body>
