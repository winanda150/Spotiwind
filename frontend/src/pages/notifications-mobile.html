<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Notifications - Spotiwind</title>
    <link rel="icon" type="image/x-icon" href="../../public/Elemen/Logo/Spotiwind.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- Path ke CSS utama dan CSS notifikasi yang baru -->
    <link rel="stylesheet" href="../assets/css/mobile-styles.css">
</head>

<body class="mobile-view">
    <div id="pageTransition" class="page-transition-overlay fade-out" aria-live="polite" aria-busy="false">
    </div>

    <div class="app-container">
        <header class="notification-page-header">
            <a href="#" id="backToHomeBtn" class="back-btn" aria-label="Go back to home">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </a>
            <h1 class="page-title">Notifications</h1>
            <button class="more-options-btn" aria-label="More options">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                    <circle cx="12" cy="12" r="1.5" />
                    <circle cx="12" cy="5" r="1.5" />
                    <circle cx="12" cy="19" r="1.5" />
                </svg>
            </button>
        </header>

        <main class="notification-list-container">
            <!-- Konten notifikasi akan dimuat di sini oleh JavaScript -->
            <div class="loader-container" style="padding-top: 5rem;">
                <div class="loader"></div>
            </div>
        </main>

    </div>

    <script type="module" src="../assets/js/notifications-mobile.js"></script>
</body>

</html>
