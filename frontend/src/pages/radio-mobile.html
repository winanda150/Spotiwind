<!-- Konten ini akan disuntikkan ke dalam .app-container di mobile.html -->

<body>
    <header class="mobile-header">
        <div class="header-left">
            <img src="frontend/public/Elemen/Logo/Spotiwind.webp" alt="Spotiwind Logo" class="mobile-logo">
            <span class="mobile-brand-name">Spotiwind</span>
        </div>
        <div class="header-right">
            <button id="notificationBtn" class="notification-btn" aria-label="Notifications">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>
                <span id="notificationBadge" class="notification-badge hidden"></span>
            </button>
            <div class="avatar-container">
                <img id="userAvatar" class="mobile-avatar" src="" alt="User Avatar">
                <span class="online-status"></span>
            </div>
            <div id="profileDropdown" class="profile-dropdown-menu">
                <div class="dropdown-user-info">
                    <img id="dropdownUserAvatar" src="" alt="User Avatar">
                    <div class="user-details">
                        <span id="dropdownUserName">User Name</span>
                        <span id="dropdownUserEmail">user@example.com</span>
                    </div>
                </div>
                <div class="dropdown-separator"></div>
                <a href="#" class="dropdown-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                        <circle cx="12" cy="7" r="4" />
                    </svg>
                    <span>My Profile</span>
                </a>
                <a href="#" class="dropdown-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path
                            d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z">
                        </path>
                    </svg>
                    <span>Liked Songs</span>
                </a>
                <a href="#" class="dropdown-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <line x1="8" y1="6" x2="21" y2="6"></line>
                        <line x1="8" y1="12" x2="21" y2="12"></line>
                        <line x1="8" y1="18" x2="21" y2="18"></line>
                        <line x1="3" y1="6" x2="3.01" y2="6"></line>
                        <line x1="3" y1="12" x2="3.01" y2="12"></line>
                        <line x1="3" y1="18" x2="3.01" y2="18"></line>
                    </svg>
                    <span>My Playlists</span>
                </a>
                <div class="dropdown-separator"></div>
                <a href="#" class="dropdown-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path
                            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
                        </path>
                    </svg>
                    <span>Settings</span>
                </a>
                <a href="#" class="dropdown-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                        <line x1="12" y1="17" x2="12.01" y2="17"></line>
                    </svg>
                    <span>Help & Support</span>
                </a>
                <div class="dropdown-separator"></div>
                <button id="logoutBtn" class="dropdown-item dropdown-item-logout">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    <span>Logout</span>
                </button>
            </div>
        </div>
    </header>

    <main class="mobile-content radio-page">
        <section class="radio-hero">
            <div class="radio-hero-copy">
                <p class="eyebrow">Live now</p>
                <h1>Radio Stations</h1>
                <p class="radio-hero-text">Tune into curated vibes for every mood, from indie chill to high-energy
                    workout tracks.</p>
            </div>
            <div class="radio-hero-badge">
                <svg class="radio-waves" viewBox="0 0 80 80" aria-hidden="true">
                    <path d="M10 44C18 44 18 28 26 28C34 28 34 44 42 44C50 44 50 28 58 28C66 28 66 44 74 44" fill="none"
                        stroke="currentColor" stroke-width="4" stroke-linecap="round" />
                    <path d="M10 54C18 54 18 38 26 38C34 38 34 54 42 54C50 54 50 38 58 38C66 38 66 54 74 54" fill="none"
                        stroke="currentColor" stroke-width="4" stroke-linecap="round" opacity="0.7" />
                    <path d="M10 64C18 64 18 48 26 48C34 48 34 64 42 64C50 64 50 48 58 48C66 48 66 64 74 64" fill="none"
                        stroke="currentColor" stroke-width="4" stroke-linecap="round" opacity="0.35" />
                </svg>
            </div>
        </section>

        <div class="radio-grid">
            <button class="radio-station-card station-pop" data-station="Pop Radio">
                <span class="station-name">Pop Radio</span>
                <span class="station-tag">Trending</span>
            </button>
            <button class="radio-station-card station-hiphop" data-station="Hip Hop Radio">
                <span class="station-name">Hip Hop Radio</span>
                <span class="station-tag">Street energy</span>
            </button>
            <button class="radio-station-card station-rock" data-station="Rock Radio">
                <span class="station-name">Rock Radio</span>
                <span class="station-tag">Classic riffs</span>
            </button>
            <button class="radio-station-card station-indie" data-station="Indie Radio">
                <span class="station-name">Indie Radio</span>
                <span class="station-tag">Fresh finds</span>
            </button>
            <button class="radio-station-card station-chill" data-station="Chill Radio">
                <span class="station-name">Chill Radio</span>
                <span class="station-tag">Smooth</span>
            </button>
            <button class="radio-station-card station-top" data-station="Top Hits Radio">
                <span class="station-name">Top Hits Radio</span>
                <span class="station-tag">Chart picks</span>
            </button>
            <button class="radio-station-card station-workout" data-station="Workout Radio">
                <span class="station-name">Workout Radio</span>
                <span class="station-tag">Power</span>
            </button>
            <button class="radio-station-card station-acoustic" data-station="Acoustic Radio">
                <span class="station-name">Acoustic Radio</span>
                <span class="station-tag">Warm tone</span>
            </button>
            <button class="radio-station-card station-indonesia" data-station="Indonesian Radio">
                <span class="station-name">Indonesian Radio</span>
                <span class="station-tag">Local vibes</span>
            </button>
            <button class="radio-station-card station-throwback" data-station="Throwback Radio">
                <span class="station-name">Throwback Radio</span>
                <span class="station-tag">Nostalgia</span>
            </button>
        </div>
    </main>
</body>
