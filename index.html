<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Spotiwind - Feel The Music, Ride The Wind</title>
    <link rel="icon" type="image/x-icon" href="frontend/public/Elemen/Logo/Spotiwind.ico">
    <link rel="stylesheet" href="frontend/src/assets/css/index.css">
    <script>
        // Ensure relative asset URLs resolve correctly from app root on deep paths or refresh
        (function() {
            var isGitHub = window.location.pathname.startsWith('/spotiwind-music');
            var basePath = isGitHub ? '/spotiwind-music/' : '/';
            var base = document.createElement('base');
            base.href = window.location.origin + basePath;
            document.head.appendChild(base);
        })();

        // Suppress third-party/extension performance observer noise in console
        (function() {
            var suppress = function(e) {
                var msg = (e && (e.message || (e.error && e.error.message) || String(e))) || '';
                var stack = (e && e.error && e.error.stack) || '';
                if (msg.indexOf('startTime') !== -1 || msg.indexOf('reportAllChanges') !== -1 ||
                    stack.indexOf('startTime') !== -1 || stack.indexOf('reportAllChanges') !== -1) {
                    if (e.preventDefault) e.preventDefault();
                    if (e.stopImmediatePropagation) e.stopImmediatePropagation();
                    return true;
                }
            };
            window.addEventListener('error', suppress, true);
            window.onerror = function(msg, url, line, col, err) {
                var text = String(msg || '') + String(err && err.stack || '');
                if (text.indexOf('startTime') !== -1 || text.indexOf('reportAllChanges') !== -1) {
                    return true;
                }
            };
            window.addEventListener('unhandledrejection', function(e) {
                var reason = String(e && e.reason ? (e.reason.message || e.reason) : '');
                if (reason.indexOf('startTime') !== -1 || reason.indexOf('reportAllChanges') !== -1) {
                    e.preventDefault();
                }
            });
        })();

        // Check for redirect from GitHub Pages 404.html (?p=/...)
        (function(l) {
            if (l.search && l.search[1] === '/' ) {
                var decoded = l.search.slice(1).split('&').map(function(s) { 
                    return s.replace(/~and~/g, '&');
                }).join('?');
                var targetPath = decoded + l.hash;
                sessionStorage.setItem('spotiwind_target_route', targetPath);
                window.history.replaceState(null, null,
                    l.pathname.slice(0, -1) + decoded + l.hash
                );
            }
        }(window.location));
    </script>
    <script type="module" src="frontend/src/assets/js/index.js"></script>
</head>
<body>
    <main class="router-loader" aria-live="polite" aria-busy="true">
        <img class="router-logo" src="frontend/public/Elemen/Logo/Spotiwind.webp" alt="Spotiwind Logo">
        <p class="router-text">Loading Spotiwind...</p>
    </main>
</body>
</html>
