<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Spotiwind - Feel The Music, Ride The Wind</title>
    <link rel="icon" type="image/x-icon" href="frontend/public/Elemen/Logo/Spotiwind.ico">
    <link rel="stylesheet" href="frontend/src/assets/css/index.css">
    <script>
        // Ensure relative asset URLs resolve correctly from app root on deep paths or refresh
        (function() {
            var base = document.createElement('base');
            base.href = window.location.origin + '/';
            document.head.appendChild(base);
        })();

        // Suppress third-party/extension performance observer noise in console
        (function() {
            var isExtensionNoise = function(text) {
                if (!text) return false;
                var str = String(text);
                return str.indexOf('startTime') !== -1 || str.indexOf('reportAllChanges') !== -1;
            };

            var suppress = function(e) {
                var msg = (e && (e.message || (e.error && e.error.message) || String(e))) || '';
                var stack = (e && e.error && e.error.stack) || '';
                if (isExtensionNoise(msg) || isExtensionNoise(stack)) {
                    if (e.preventDefault) e.preventDefault();
                    if (e.stopImmediatePropagation) e.stopImmediatePropagation();
                    return true;
                }
            };
            window.addEventListener('error', suppress, true);
            window.onerror = function(msg, url, line, col, err) {
                var text = String(msg || '') + ' ' + String(err && err.stack || '');
                if (isExtensionNoise(text)) {
                    return true;
                }
            };
            window.addEventListener('unhandledrejection', function(e) {
                var reason = String(e && e.reason ? (e.reason.message || e.reason.stack || e.reason) : '');
                if (isExtensionNoise(reason)) {
                    e.preventDefault();
                }
            });

            // Intercept console.error calls from injected scripts
            if (window.console && window.console.error) {
                var origError = window.console.error;
                window.console.error = function() {
                    var args = Array.prototype.slice.call(arguments);
                    var joined = args.map(function(a) {
                        return (a && (a.message || a.stack || String(a))) || '';
                    }).join(' ');
                    if (isExtensionNoise(joined)) {
                        return;
                    }
                    return origError.apply(window.console, arguments);
                };
            }
        })();
    </script>
    <script type="module" src="frontend/src/assets/js/index.js"></script>
</head>
<body>
    <main class="router-loader" aria-live="polite" aria-busy="true">
        <img class="router-logo" src="frontend/public/Elemen/Logo/Spotiwind.webp" alt="Spotiwind Logo">
        <p class="router-text">Loading Spotiwind...</p>
    </main>
</body>
</html>
